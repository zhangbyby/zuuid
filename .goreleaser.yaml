version: 2

project_name: zuuid

before:
  hooks:
    - cargo fetch --locked

builds:
  - id: zuuid
    builder: rust
    binary: zuuid
    command: zigbuild
    flags:
      - --release
      - --locked
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu

  - id: zuuid-windows
    builder: rust
    binary: zuuid
    command: build
    flags:
      - --release
      - --locked
    env:
      - CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
    targets:
      - x86_64-pc-windows-gnu

archives:
  - id: archive
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  prerelease: auto
  github:
    owner: zhangbyby
    name: zuuid
